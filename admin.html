<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 농가 생육 데이터 시각화 대시보드</title>
  
  <!-- 🔵 파란 동그라미 아이콘 및 PWA 설정 -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1040/1040236.png">
  <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040236.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040236.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; background-color: #f8f9fa; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 25px; }
    .filter-group { display: flex; gap: 20px; align-items: center; margin-bottom: 0; flex-wrap: wrap; }
    .filter-item { display: flex; align-items: center; gap: 8px; }
    select { padding: 8px 12px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; background-color: #fff; }
    .chart-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .chart-container { width: 100%; height: 420px; position: relative; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    /* 삭제 버튼 스타일 */
    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.2s;
    }
    .delete-btn:hover {
      background-color: #bd2130;
    }
  </style>
</head>
<body>

  <!-- 필터 카테고리 -->
  <div class="card" style="padding: 15px 24px;">
    <div class="filter-group">
      <!-- 1. 조사 유형 선택 -->
      <div class="filter-item">
        <label for="viewType"><b>📋 조사 유형:</b></label>
        <select id="viewType">
          <option value="현장">현장 조사 데이터</option>
          <option value="수확">수확 조사 데이터</option>
        </select>
      </div>

      <!-- 2. 조사 월 선택 -->
      <div class="filter-item">
        <label for="surveyMonth"><b>📅 월 선택:</b></label>
        <select id="surveyMonth">
          <option value="all">전체 월</option>
          <option value="1">1월</option>
          <option value="2">2월</option>
          <option value="3">3월</option>
          <option value="4">4월</option>
          <option value="5">5월</option>
          <option value="6">6월</option>
          <option value="7">7월</option>
          <option value="8">8월</option>
          <option value="9">9월</option>
          <option value="10">10월</option>
          <option value="11">11월</option>
          <option value="12">12월</option>
        </select>
      </div>

      <!-- 3. 순(상/중/하순) 선택 -->
      <div class="filter-item">
        <label for="surveyTenDay"><b>📆 순 선택:</b></label>
        <select id="surveyTenDay">
          <option value="all">전체 순</option>
          <option value="early">상순 (1~10일)</option>
          <option value="mid">중순 (11~20일)</option>
          <option value="late">하순 (21~말일)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 1. 초장 비교 그래프 -->
  <div class="card">
    <div class="chart-title">📏 농가별 평균 초장 비교 (cm)</div>
    <div class="chart-container">
      <canvas id="heightChart"></canvas>
    </div>
  </div>

  <!-- 2. 엽수 비교 그래프 -->
  <div class="card">
    <div class="chart-title">🥬 농가별 평균 총 엽수 비교 (외엽+내엽, 개)</div>
    <div class="chart-container">
      <canvas id="leafChart"></canvas>
    </div>
  </div>

  <!-- 상세 데이터 표 -->
  <div class="card">
    <h3>📋 수집 데이터 상세 목록</h3>
    <div style="overflow-x:auto;">
      <table>
        <thead id="tableHeader"></thead>
        <tbody id="dataTable"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    // doc, deleteDoc 함수 추가 불러오기
    import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC5O35f1bCuyXZAXkd2g1sGAFRM3SXzwp8",
      authDomain: "sangwook-6d3c2.firebaseapp.com",
      projectId: "sangwook-6d3c2",
      storageBucket: "sangwook-6d3c2.firebasestorage.app",
      messagingSenderId: "947126595051",
      appId: "1:947126595051:web:69bc46f80e581bfe30bdae",
      measurementId: "G-CKC3MLSQSL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let heightChart = null;
    let leafChart = null;
    let rawDataList = [];

    // 초장 차트 그리기
    function renderHeightChart(labels, heightData) {
      const ctx = document.getElementById('heightChart').getContext('2d');
      if (heightChart) heightChart.destroy();

      heightChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '평균 초장 (cm)',
            data: heightData,
            backgroundColor: 'rgba(54, 162, 235, 0.75)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1,
            barThickness: 40
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // 엽수 차트 그리기
    function renderLeafChart(labels, leafData) {
      const ctx = document.getElementById('leafChart').getContext('2d');
      if (leafChart) leafChart.destroy();

      leafChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '평균 총 엽수 (개)',
            data: leafData,
            backgroundColor: 'rgba(46, 204, 113, 0.75)',
            borderColor: 'rgba(46, 204, 113, 1)',
            borderWidth: 1,
            barThickness: 40
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // 대시보드 필터링 및 업데이트
    function updateDashboard() {
      const selectedType = document.getElementById('viewType').value;
      const selectedMonth = document.getElementById('surveyMonth').value;
      const selectedTenDay = document.getElementById('surveyTenDay').value;

      const filteredData = rawDataList.filter(item => {
        // 1. 조사 유형 필터링
        if (item.surveyType !== selectedType) return false;

        if (!item.date) return false;        
        const dateObj = new Date(item.date);
        const month = dateObj.getMonth() + 1; // 1~12월
        const day = dateObj.getDate();        // 1~31일

        // 2. 월 필터링
        if (selectedMonth !== 'all' && month !== parseInt(selectedMonth)) {
          return false;
        }

        // 3. 순(상순/중순/하순) 필터링
        if (selectedTenDay === 'early' && !(day >= 1 && day <= 10)) return false;
        if (selectedTenDay === 'mid' && !(day >= 11 && day <= 20)) return false;
        if (selectedTenDay === 'late' && !(day >= 21)) return false;

        return true;
      });

      const tableHeader = document.getElementById('tableHeader');
      const tableBody = document.getElementById('dataTable');

      tableHeader.innerHTML = '';
      tableBody.innerHTML = '';

      // 삭제/관리 열(<th>관리</th>) 추가
      if (selectedType === '현장') {
        tableHeader.innerHTML = `<tr>
          <th>조사팀</th><th>농가명</th><th>일자</th><th>개체번호</th>
          <th>초장(cm)</th><th>엽장(cm)</th><th>엽폭(cm)</th><th>외엽수</th><th>내엽수</th>
          <th>관리</th>
        </tr>`;
      } else {
        tableHeader.innerHTML = `<tr>
          <th>조사팀</th><th>농가명</th><th>일자</th><th>개체번호</th>
          <th>초장(cm)</th><th>엽장(cm)</th><th>엽폭(cm)</th><th>구고(cm)</th><th>구폭(cm)</th>
          <th>외엽수</th><th>내엽수</th><th>주중(g)</th><th>구중(g)</th>
          <th>관리</th>
        </tr>`;
      }

      const farmMap = {};

      filteredData.forEach(item => {
        const d = item.data || {};
        const pNo = item.plantNo || '-';

        let row = `<tr><td>${item.team || '-'}</td><td>${item.farmName || '-'}</td><td>${item.date || '-'}</td><td><b>${pNo}</b></td>`;
        if (selectedType === '현장') {
          row += `<td>${d.plantHeight || 0}</td><td>${d.leafLength || 0}</td><td>${d.leafWidth || 0}</td><td>${d.outerLeaves || 0}</td><td>${d.innerLeaves || 0}</td>`;
        } else {
          row += `<td>${d.plantHeight || 0}</td><td>${d.leafLength || 0}</td><td>${d.leafWidth || 0}</td><td>${d.bulbHeight || 0}</td><td>${d.bulbWidth || 0}</td>
                  <td>${d.outerLeaves || 0}</td><td>${d.innerLeaves || 0}</td><td>${d.plantWeight || 0}</td><td>${d.bulbWeight || 0}</td>`;
        }
        
        // 삭제 버튼 열 추가 (item.docId 전달)
        row += `<td><button class="delete-btn" data-id="${item.docId}">삭제</button></td>`;
        row += `</tr>`;
        tableBody.innerHTML += row;

        const farmKey = item.farmName || '미지정';
        if (!farmMap[farmKey]) {
          farmMap[farmKey] = { totalHeight: 0, totalLeaves: 0, count: 0 };
        }        
        farmMap[farmKey].totalHeight += (Number(d.plantHeight) || 0);
        farmMap[farmKey].totalLeaves += ((Number(d.outerLeaves) || 0) + (Number(d.innerLeaves) || 0));
        farmMap[farmKey].count += 1;
      });

      const farms = Object.keys(farmMap);
      const avgHeight = farms.map(f => (farmMap[f].totalHeight / farmMap[f].count).toFixed(1));
      const avgLeaves = farms.map(f => (farmMap[f].totalLeaves / farmMap[f].count).toFixed(1));

      // 차트 호출
      renderHeightChart(farms, avgHeight);
      renderLeafChart(farms, avgLeaves);
    }

    // 삭제 버튼 클릭 이벤트 처리
    document.getElementById('dataTable').addEventListener('click', async (e) => {
      if (e.target.classList.contains('delete-btn')) {
        const docId = e.target.getAttribute('data-id');
        
        if (confirm("정말로 이 조사 데이터를 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.")) {
          try {
            await deleteDoc(doc(db, "farm_growth", docId));
            alert("성공적으로 삭제되었습니다.");
          } catch (error) {
            console.error("삭제 실패:", error);
            alert("삭제에 실패했습니다. 권한을 확인하세요.");
          }
        }
      }
    });

    // 필터 변경 이벤트 리스너 연결
    document.getElementById('viewType').addEventListener('change', updateDashboard);
    document.getElementById('surveyMonth').addEventListener('change', updateDashboard);
    document.getElementById('surveyTenDay').addEventListener('change', updateDashboard);

    // Firebase 실시간 데이터 감지 (문서 고유 ID 포함 저장)
    const q = query(collection(db, "farm_growth"), orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      rawDataList = [];
      snapshot.forEach(docSnap => {
        // 데이터 원본과 함께 파이어베이스 문서 고유 ID(docId)를 함께 저장
        rawDataList.push({ docId: docSnap.id, ...docSnap.data() });
      });
      updateDashboard(); // 차트 및 표 갱신
    });
  </script>
</body>
</html>
